<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Categoría | Farmacia Herrera Acosta</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Nuestro CSS -->
<link rel="stylesheet" href="css/estilos.css?v=4">


</head>

<body>


<header>

    <div class="container">

        <div class="row align-items-center py-3 fila-header">

            <!-- Logo -->
            <div class="col-lg-3">
                <a class="marca" href="index.html" aria-label="Farmacia Herrera Acosta, inicio">
                    <img class="marca-simbolo" src="imagen/logo-trebol.png" alt="">
                    <span>
                        <strong>Herrera Acosta</strong>
                        <small>Farmacia &amp; bienestar</small>
                    </span>
                </a>
            </div>

            <!-- Buscador -->
            <div class="col-lg-5">

                <form id="formularioBusqueda">
                    <div class="input-group">

                        <input 
                            id="campoBusqueda"
                            type="search" 
                            class="form-control" 
                            placeholder="¿Qué estás buscando?"
                            aria-label="Buscar productos"
                        >

                        <button class="btn btn-primary boton-buscar" type="submit">
                            <i class="bi bi-search" aria-hidden="true"></i>
                            Buscar
                        </button>

                    </div>
                </form>

            </div>

            <!-- Acciones -->
            <div class="col-lg-4 acciones-header">

                <button class="accion-header" type="button">
                    <i class="bi bi-geo-alt" aria-hidden="true"></i>
                    <span>Elegí entrega</span>
                </button>

                <button class="accion-header" type="button">
                    <i class="bi bi-person" aria-hidden="true"></i>
                    <span>Ingresar</span>
                </button>

                <button class="accion-header" type="button">
                    <i class="bi bi-box-seam" aria-hidden="true"></i>
                    <span>Estado del pedido</span>
                </button>

                <button id="btnAbrirCarrito" class="accion-header carrito-header" type="button">
                    <i class="bi bi-cart3" aria-hidden="true"></i>
                    <span>Carrito</span>
                    <span id="contadorCarrito" class="badge rounded-pill bg-danger" aria-live="polite" hidden>0</span>
                </button>
            </div>

        </div>

    </div>

</header>

<nav class="barra-categorias">

    <div class="barra-categorias-contenido">

        <a class="enlace-categoria oferta-nav" href="categoria.html?c=ofertas" data-categoria="ofertas">▰ OFERTAS</a>
        <a class="enlace-categoria" href="categoria.html?c=skin-care" data-categoria="skin-care">Skin Care</a>
        <a class="enlace-categoria" href="categoria.html?c=solares" data-categoria="solares">Solares</a>
        <a class="enlace-categoria" href="categoria.html?c=maquillaje" data-categoria="maquillaje">Maquillaje</a>
        <a class="enlace-categoria" href="categoria.html?c=dermocosmetica" data-categoria="dermocosmetica">Dermocosmética</a>
        <a class="enlace-categoria" href="categoria.html?c=cuidado-personal" data-categoria="cuidado-personal">Cuidado Personal</a>
        <a class="enlace-categoria" href="categoria.html?c=bebes" data-categoria="bebes">Bebés</a>

    </div>

</nav>

<main class="container mt-4 mb-5 pagina-categoria">

    <nav aria-label="Ubicación" class="miga">
        <a href="index.html">Inicio</a>
        <span aria-hidden="true">›</span>
        <span id="migaCategoria" aria-current="page">Categoría</span>
    </nav>

    <div class="cabecera-categoria">
        <h1 id="tituloCategoria">Categoría</h1>
        <p id="descripcionCategoria"></p>
    </div>

    <p id="mensajeBusqueda" class="mensaje-busqueda text-center" hidden>
        No encontramos productos con esa búsqueda.
    </p>

    <div id="categoriaVacia" class="categoria-vacia" hidden>
        <i class="bi bi-bag-heart" aria-hidden="true"></i>
        <p>Muy pronto vas a encontrar productos en esta categoría.</p>
        <a href="index.html" class="btn btn-primary">Volver al inicio</a>
    </div>

    <div id="listaCategoria" class="row g-4"></div>

</main>

<div id="fondoCarrito"></div>

<section id="carrito">

    <div class="carrito-cabecera">

        <h2>🛒 Mi carrito</h2>

        <button id="btnCerrarCarrito" type="button">
            ✕
        </button>

    </div>

    <div id="contenidoCarrito">
    </div>

</section>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Nuestro JavaScript -->
<script src="js/productos.js?v=4"></script>
<script src="js/categoria.js?v=4"></script>
<script src="js/script.js?v=4"></script>


</body>

</html>
